name: fork_scroll_momentum
description: The fork's trackpad momentum from macOS (docs/fork.md), passed to Flutter as the fingers' pan.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: ForkScrollMomentumPlugin
